name: ci-geoserver-node-client
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '24'

      - run: npm install

      - name: Check TypeScript declaration generation
        run: npm run build:types

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '24'

      - run: npm install

      # fast feedback, no GeoServer needed
      - run: npm run lint
      - run: npm run test:unit

  run-integration-tests:
    needs: run-unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let both GeoServer versions finish even if one fails
      matrix:
        include:
          - name: maintenance
            geoserver_version: 2.28.6
            geoserver_port: 8080
          - name: stable
            geoserver_version: 3.0.2
            geoserver_port: 8081
    name: run-integration-tests-${{ matrix.name }}
    env:
      GEOSERVER_VERSION: ${{ matrix.geoserver_version }}
      GEOSERVER_PORT: ${{ matrix.geoserver_port }}
    steps:
      - name: Install program "wait-for-it"
        run: sudo apt install wait-for-it

      - uses: actions/setup-node@v3
        with:
          node-version: '24'

      - uses: actions/checkout@v4

      - uses: satackey/action-docker-layer-caching@v0.0.11
        continue-on-error: true

      - name: Create empty temp directory as volume for GeoServer data
        run: |
          RANDOM_FOLDER="docker-temp-$(uuidgen)"
          TEMP_DIR="${{ runner.temp }}/$RANDOM_FOLDER"
          echo "TEMP_DIR=$TEMP_DIR" >> $GITHUB_ENV
          mkdir -p "$TEMP_DIR"

      - name: Run docker-compose test setup
        run: docker compose -f test/docker-compose.yml up -d

      - run: wait-for-it "localhost:$GEOSERVER_PORT"
      - run: wget "http://localhost:$GEOSERVER_PORT/geoserver/web"

      - run: npm install
      - run: npm run test:reset-gs
      - run: npm run test:integration
